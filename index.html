<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宮島ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    #miyajimaOverlay {
      display: none;
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 520px;
      z-index: 9000;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="msg">
  宮島ちゅーピーステッカーを映してね
</div>

<img id="miyajimaOverlay" src="./miyajima.jpg" alt="宮島背景">

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>

</a-scene>

<script>
  const msg = document.getElementById("msg");
  const target = document.getElementById("target");
  const overlay = document.getElementById("miyajimaOverlay");

  target.addEventListener("targetFound", () => {
    msg.innerHTML = "認識成功！宮島の世界が広がるよ✨";
    msg.style.background = "yellow";
    overlay.style.display = "block";
  });

  target.addEventListener("targetLost", () => {
    msg.innerHTML = "ステッカーをもう一度映してね";
    msg.style.background = "white";
    overlay.style.display = "none";
  });
</script>

</body>
</html>
