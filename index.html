<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宮島ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    #miyajimaOverlay {
      display: none;
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 520px;
      z-index: 9000;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="msg">
  宮島ちゅーピーステッカーを映してね
</div>

<video
  id="miyajimaOverlay"
  src="./miyajima.mp4"
  muted
  autoplay
  playsinline
  webkit-playsinline
  loop
  preload="auto">
</video>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>

</a-scene>

<script>
  const msg = document.getElementById("msg");
  const target = document.getElementById("target");
  const overlay = document.getElementById("miyajimaOverlay");

  let isFound = false;

  target.addEventListener("targetFound", () => {
    isFound = true;

    msg.innerHTML = "認識成功！画面をタップすると宮島動画が動くよ✨";
    msg.style.background = "yellow";

    overlay.style.display = "block";
    overlay.currentTime = 0;
    overlay.muted = true;

    overlay.play().catch(() => {
      msg.innerHTML = "認識成功！画面をタップして動画を再生してね";
    });
  });

  target.addEventListener("targetLost", () => {
    isFound = false;

    msg.innerHTML = "ステッカーをもう一度映してね";
    msg.style.background = "white";

    overlay.pause();
    overlay.style.display = "none";
  });

  function playVideo() {
    if (isFound) {
      overlay.style.display = "block";
      overlay.muted = true;
      overlay.play();
    }
  }

  document.body.addEventListener("click", playVideo);
  document.body.addEventListener("touchstart", playVideo);
</script>

</body>
</html>
