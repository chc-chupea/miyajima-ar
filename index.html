<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    #scanGuide {
      position: fixed;
      left: 7vw;
      right: 7vw;
      top: 86px;
      height: 54vh;
      z-index: 999997;
      border: 5px dashed rgba(255, 235, 0, 0.95);
      border-radius: 22px;
      pointer-events: none;
      box-sizing: border-box;
    }

    #scanGuide::before {
      content: "この枠いっぱいに1枚だけ映してね";
      position: absolute;
      top: -42px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: bold;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 8px;
    }

    #videoOverlay,
    #imageOverlay {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: 90vw;
      max-width: 520px;
      max-height: 34vh;
      object-fit: contain;
      z-index: 999998;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      background: black;
      pointer-events: auto;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="msg">ステッカーを1枚だけ大きく映してね</div>
<div id="scanGuide"></div>

<video
  id="videoOverlay"
  controls
  playsinline
  webkit-playsinline
  preload="metadata">
</video>

<img id="imageOverlay" src="" alt="AR画像">

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="miyajima"></a-entity>
  <a-entity mindar-image-target="targetIndex: 1" id="kure"></a-entity>
  <a-entity mindar-image-target="targetIndex: 2" id="fukuyama"></a-entity>
  <a-entity mindar-image-target="targetIndex: 3" id="chugokunp"></a-entity>

</a-scene>

<script>
  const msg = document.getElementById("msg");
  const videoOverlay = document.getElementById("videoOverlay");
  const imageOverlay = document.getElementById("imageOverlay");

  const targets = [
    {
      el: document.getElementById("miyajima"),
      type: "video",
      message: "ちゅーピーが宮島の旅へ連れて行くよ✨",
      src: "./miyajima.mp4"
    },
    {
      el: document.getElementById("kure"),
      type: "image",
      message: "ちゅーピーが呉の旅へ連れて行くよ✨",
      src: "./kure.jpg"
    },
    {
      el: document.getElementById("fukuyama"),
      type: "image",
      message: "ちゅーピーが福山の旅へ連れて行くよ✨",
      src: "./fukuyama.jpg"
    },
    {
      el: document.getElementById("chugokunp"),
      type: "image",
      message: "新しくなった中国新聞デジタルをご紹介！",
      src: "./chugokunp.jpg"
    }
  ];

  let activeTimer = null;
  let activeTarget = null;

  function hideAll() {
    videoOverlay.pause();
    videoOverlay.currentTime = 0;
    videoOverlay.removeAttribute("src");
    videoOverlay.load();
    videoOverlay.style.display = "none";

    imageOverlay.style.display = "none";
    imageOverlay.src = "";

    msg.style.display = "block";
  }

  function showContent(target) {
    hideAll();

    msg.innerHTML = target.message;
    msg.style.background = "yellow";

    if (target.type === "video") {
      videoOverlay.src = target.src;
      videoOverlay.style.display = "block";
      videoOverlay.load();

      videoOverlay.onplay = () => {
        msg.style.display = "none";
      };

      videoOverlay.onpause = () => {
        msg.style.display = "block";
      };

      videoOverlay.onended = () => {
        msg.style.display = "block";
      };
    } else {
      imageOverlay.src = target.src;
      imageOverlay.style.display = "block";
    }
  }

  function startStableDetection(target) {
    clearTimeout(activeTimer);
    activeTarget = target;

    msg.innerHTML = "そのまま少し止めてね…";
    msg.style.background = "#fff34a";

    activeTimer = setTimeout(() => {
      if (activeTarget === target) {
        showContent(target);
      }
    }, 800);
  }

  function resetDetection() {
    clearTimeout(activeTimer);
    activeTarget = null;

    msg.style.display = "block";
    msg.innerHTML = "ステッカーを1枚だけ大きく映してね";
    msg.style.background = "white";

    hideAll();
  }

  targets.forEach(target => {
    target.el.addEventListener("targetFound", () => {
      startStableDetection(target);
    });

    target.el.addEventListener("targetLost", () => {
      if (activeTarget === target) {
        resetDetection();
      }
    });
  });
</script>

</body>
</html>
