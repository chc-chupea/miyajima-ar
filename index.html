<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宮島ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .message {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 12px;
      border-radius: 14px;
      font-family: sans-serif;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="message">
    宮島ちゅーピーステッカーを映してね！<br>
    シール全体が見えるようにすると宮島が広がるよ✨
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="miyajima" src="./miyajima.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- ステッカーの上側・奥に宮島背景を出す -->
      <a-plane
        src="#miyajima"
        position="0 0.55 0"
        width="2.8"
        height="1.6">
      </a-plane>

    </a-entity>

  </a-scene>
</body>
</html>
