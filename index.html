<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #fff;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    #videoOverlay,
    #imageOverlay {
      display: none;
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 520px;
      z-index: 999998;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      background: black;
      pointer-events: auto;
    }

    a-scene {
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="msg">
  ステッカーを映してね
</div>

<video
  id="videoOverlay"
  controls
  playsinline
  webkit-playsinline
  preload="metadata">
</video>

<img id="imageOverlay" src="" alt="AR画像">

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="miyajima"></a-entity>
  <a-entity mindar-image-target="targetIndex: 1" id="kure"></a-entity>
  <a-entity mindar-image-target="targetIndex: 2" id="fukuyama"></a-entity>
  <a-entity mindar-image-target="targetIndex: 3" id="chugokunp"></a-entity>

</a-scene>

<script>
  const msg = document.getElementById("msg");
  const videoOverlay = document.getElementById("videoOverlay");
  const imageOverlay = document.getElementById("imageOverlay");

  const miyajima = document.getElementById("miyajima");
  const kure = document.getElementById("kure");
  const fukuyama = document.getElementById("fukuyama");
  const chugokunp = document.getElementById("chugokunp");

  function hideAll() {
    videoOverlay.pause();
    videoOverlay.currentTime = 0;
    videoOverlay.removeAttribute("src");
    videoOverlay.load();
    videoOverlay.style.display = "none";

    imageOverlay.style.display = "none";
    imageOverlay.src = "";

    msg.style.display = "block";
  }

  function showVideo(message, videoSrc) {
    hideAll();

    msg.style.display = "block";
    msg.innerHTML = message;
    msg.style.background = "yellow";

    videoOverlay.src = videoSrc;
    videoOverlay.style.display = "block";
    videoOverlay.load();

    videoOverlay.onplay = () => {
      msg.style.display = "none";
    };

    videoOverlay.onpause = () => {
      msg.style.display = "block";
    };

    videoOverlay.onended = () => {
      msg.style.display = "block";
    };
  }

  function showImage(message, imageSrc) {
    hideAll();

    msg.style.display = "block";
    msg.innerHTML = message;
    msg.style.background = "yellow";

    imageOverlay.src = imageSrc;
    imageOverlay.style.display = "block";
  }

  miyajima.addEventListener("targetFound", () => {
    showVideo(
      "ちゅーピーが宮島の旅へ連れて行くよ✨",
      "./miyajima.mp4"
    );
  });

  kure.addEventListener("targetFound", () => {
    showImage(
      "ちゅーピーが呉の旅へ連れて行くよ✨",
      "./kure.jpg"
    );
  });

  fukuyama.addEventListener("targetFound", () => {
    showImage(
      "ちゅーピーが福山の旅へ連れて行くよ✨",
      "./fukuyama.jpg"
    );
  });

  chugokunp.addEventListener("targetFound", () => {
    showImage(
      "新しくなった中国新聞デジタルをご紹介！",
      "./chugokunp.jpg"
    );
  });

  function resetMessage() {
    msg.style.display = "block";
    msg.innerHTML = "ステッカーをもう一度映してね";
    msg.style.background = "white";
    hideAll();
  }

  miyajima.addEventListener("targetLost", resetMessage);
  kure.addEventListener("targetLost", resetMessage);
  fukuyama.addEventListener("targetLost", resetMessage);
  chugokunp.addEventListener("targetLost", resetMessage);
</script>

</body>
</html>
