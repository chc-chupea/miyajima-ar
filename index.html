<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宮島ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #msg {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div id="msg">
  読み込み中…カメラ許可が出たら許可してください
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target">

    <a-plane
      color="red"
      width="1"
      height="1"
      position="0 0 0"
      rotation="0 0 0"
      material="side: double; shader: flat;">
    </a-plane>

  </a-entity>

</a-scene>

<script>
  const msg = document.getElementById("msg");
  const target = document.getElementById("target");

  window.addEventListener("load", () => {
    msg.innerHTML = "カメラが起動したら、ステッカーを画面いっぱいに映してください";
  });

  target.addEventListener("targetFound", () => {
    msg.innerHTML = "認識成功！赤い板がステッカー上に出れば表示成功です";
    msg.style.background = "yellow";
  });

  target.addEventListener("targetLost", () => {
    msg.innerHTML = "見失いました。もう一度ステッカー全体を映してください";
    msg.style.background = "white";
  });
</script>

</body>
</html>
