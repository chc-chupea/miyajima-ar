<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ちゅーピーAR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff;
      overflow: auto;
    }

    #page {
      padding: 10px 14px 30px;
      box-sizing: border-box;
    }

    #msg {
      background: #fff34a;
      padding: 12px;
      border-radius: 14px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    #scanArea {
      border: 3px dashed #fff34a;
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 18px;
      background: #fff;
    }

    #scanTitle {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #arWrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 14px;
      background: #f3f3f3;
      position: relative;
    }

    a-scene {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      inset: 0;
      pointer-events: none;
    }

    #contentTitle {
      display: none;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 4px 0 10px;
    }

    #videoOverlay,
    #imageOverlay {
      display: none;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      background: black;
    }

    #imageOverlay {
      background: transparent;
    }
  </style>
</head>

<body>

<div id="page">

  <div id="msg">
    ステッカーを映してね
  </div>

  <div id="scanArea">
    <div id="scanTitle">
      ✨ ステッカーを映してね ✨
    </div>

    <div id="arWrapper">
      <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera
          position="0 0 0"
          look-controls="enabled: false"
          wasd-controls="enabled: false">
        </a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="miyajima"></a-entity>
        <a-entity mindar-image-target="targetIndex: 1" id="kure"></a-entity>
        <a-entity mindar-image-target="targetIndex: 2" id="fukuyama"></a-entity>
        <a-entity mindar-image-target="targetIndex: 3" id="chugokunp"></a-entity>

      </a-scene>
    </div>
  </div>

  <div id="contentTitle">
    ✨ ARコンテンツ ✨
  </div>

  <video
    id="videoOverlay"
    controls
    playsinline
    webkit-playsinline
    preload="metadata">
  </video>

  <img id="imageOverlay" src="" alt="AR画像">

</div>

<script>
  const msg = document.getElementById("msg");
  const contentTitle = document.getElementById("contentTitle");

  const videoOverlay = document.getElementById("videoOverlay");
  const imageOverlay = document.getElementById("imageOverlay");

  const miyajima = document.getElementById("miyajima");
  const kure = document.getElementById("kure");
  const fukuyama = document.getElementById("fukuyama");
  const chugokunp = document.getElementById("chugokunp");

  function hideAll() {
    videoOverlay.pause();
    videoOverlay.currentTime = 0;
    videoOverlay.removeAttribute("src");
    videoOverlay.load();
    videoOverlay.style.display = "none";

    imageOverlay.style.display = "none";
    imageOverlay.src = "";

    contentTitle.style.display = "none";
  }

  function showVideo(message, videoSrc) {
    hideAll();

    msg.innerHTML = message + "<br>動画の再生ボタンを押してね";
    msg.style.background = "#fff34a";

    contentTitle.style.display = "block";

    videoOverlay.src = videoSrc;
    videoOverlay.style.display = "block";
    videoOverlay.load();
  }

  function showImage(message, imageSrc) {
    hideAll();

    msg.innerHTML = message;
    msg.style.background = "#fff34a";

    contentTitle.style.display = "block";

    imageOverlay.src = imageSrc;
    imageOverlay.style.display = "block";
  }

  miyajima.addEventListener("targetFound", () => {
    showVideo(
      "ちゅーピーが宮島の旅へ連れて行くよ✨",
      "./miyajima.mp4"
    );
  });

  kure.addEventListener("targetFound", () => {
    showImage(
      "ちゅーピーが呉の旅へ連れて行くよ✨",
      "./kure.jpg"
    );
  });

  fukuyama.addEventListener("targetFound", () => {
    showImage(
      "ちゅーピーが福山の旅へ連れて行くよ✨",
      "./fukuyama.jpg"
    );
  });

  chugokunp.addEventListener("targetFound", () => {
    showImage(
      "新しくなった中国新聞デジタルをご紹介！",
      "./chugokunp.jpg"
    );
  });

  function resetMessage() {
    msg.innerHTML = "ステッカーをもう一度映してね";
    msg.style.background = "white";
    hideAll();
  }

  miyajima.addEventListener("targetLost", resetMessage);
  kure.addEventListener("targetLost", resetMessage);
  fukuyama.addEventListener("targetLost", resetMessage);
  chugokunp.addEventListener("targetLost", resetMessage);
</script>

</body>
</html>
